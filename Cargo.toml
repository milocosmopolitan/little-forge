[workspace]
members = ["apps/desktop", "apps/npc-preview", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log", "bevy_color", "bevy_core_pipeline", "bevy_render", "bevy_image", "bevy_mesh", "bevy_camera", "bevy_shader", "bevy_sprite", "bevy_sprite_render", "bevy_text", "bevy_ui", "bevy_ui_render", "bevy_ui_widgets", "ui_picking", "bevy_window", "bevy_winit", "default_font", "png", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
forge-core = { path = "crates/forge-core" }
forge-content = { path = "crates/forge-content" }

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"

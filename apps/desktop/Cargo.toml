[package]
name = "little-forge"
version.workspace = true
edition.workspace = true
publish.workspace = true
[dependencies]
bevy.workspace = true
forge-core.workspace = true
forge-content.workspace = true
forge-npc = { path = "../../crates/forge-npc" }
serde.workspace = true
serde_json.workspace = true
directories = "6"
global-hotkey = "=0.8.0"

[target.'cfg(target_os = "windows")'.dependencies]
bevy = { workspace = true, features = ["statically-linked-dxc"] }
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSScreen"] }

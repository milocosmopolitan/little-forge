<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leatherworker 표정·포즈</title><style>body{font:16px system-ui;margin:24px;background:#202026;color:#eee}main{max-width:720px;margin:auto}h1{font-size:22px}section{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}button,select,input{font:inherit}#stage{width:384px;background:#efe5cd}@media(max-width:431px){#stage{width:288px}}@media(max-width:335px){#stage{width:192px}}@media(max-width:239px){#stage{width:96px}}img{display:block;width:100%;image-rendering:pixelated}small{color:#b8b8c2}label{display:flex;gap:6px;align-items:center}output{font-variant-numeric:tabular-nums}</style><main><h1>가죽세공사 · 표정과 포즈</h1><section><label>동작 <select id="clip"></select></label><button id="play">일시정지</button><button id="prev">이전 키</button><button id="next">다음 키</button></section><section><label><input id="gear" type="checkbox" checked>장비</label><label><input id="repeat" type="checkbox" checked>반복 미리보기</label><label>배율 <select id="scale"><option value="1">1×</option><option value="4" selected>4×</option></select></label><label>배경 <select id="bg"><option value="#efe5cd">밝게</option><option value="#24232a">어둡게</option></select></label><label>속도 <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label></section><div id="stage"><img id="sprite" alt="가죽세공사 애니메이션 프레임"></div><section><input id="scrub" type="range" min="0" value="0"><output id="info"></output></section><small>96×128 원본의 정수 배율 표시, 기본 4배. 전달 이벤트는 transfer 키에만 표시됩니다. 반복 미리보기는 비반복 클립도 확인용으로 반복합니다.</small></main><script>const data={"clips":{"idle":{"loop":true,"frames":[{"sprite":"neutral","duration_ms":1600},{"sprite":"blink-half","duration_ms":40},{"sprite":"blink","duration_ms":80},{"sprite":"blink-half","duration_ms":40},{"sprite":"neutral","duration_ms":1200}]},"talk":{"loop":true,"frames":[{"sprite":"neutral","duration_ms":140},{"sprite":"talk-small","duration_ms":100},{"sprite":"talk-wide","duration_ms":100},{"sprite":"talk-small","duration_ms":100},{"sprite":"talk-round","duration_ms":100},{"sprite":"neutral","duration_ms":140}]},"blink":{"loop":false,"frames":[{"sprite":"neutral","duration_ms":300},{"sprite":"blink-half","duration_ms":40},{"sprite":"blink","duration_ms":80},{"sprite":"blink-half","duration_ms":40},{"sprite":"neutral","duration_ms":300}]},"happy":{"loop":false,"frames":[{"sprite":"happy","duration_ms":700},{"sprite":"neutral","duration_ms":140}]},"surprised":{"loop":false,"frames":[{"sprite":"surprised","duration_ms":600},{"sprite":"neutral","duration_ms":140}]},"relaxed":{"loop":false,"frames":[{"sprite":"relaxed","duration_ms":700},{"sprite":"neutral","duration_ms":140}]},"nod":{"loop":false,"frames":[{"sprite":"neutral","duration_ms":120},{"sprite":"nod-mid","duration_ms":100},{"sprite":"nod-down","duration_ms":140},{"sprite":"nod-mid","duration_ms":100},{"sprite":"neutral","duration_ms":120}]},"shake_head":{"loop":false,"frames":[{"sprite":"neutral","duration_ms":100},{"sprite":"turn-toward","duration_ms":140},{"sprite":"neutral","duration_ms":100},{"sprite":"turn-away","duration_ms":140},{"sprite":"neutral","duration_ms":100}]},"give":{"loop":false,"frames":[{"sprite":"neutral","duration_ms":120},{"sprite":"give-mid","duration_ms":120},{"sprite":"give-extended","duration_ms":180},{"sprite":"give-extended-empty","duration_ms":120,"event":"transfer"},{"sprite":"give-mid-empty","duration_ms":120},{"sprite":"neutral-no-prop","duration_ms":120}]},"walk":{"loop":true,"frames":[{"sprite":"walk-0","duration_ms":120},{"sprite":"walk-1","duration_ms":120},{"sprite":"walk-2","duration_ms":120},{"sprite":"walk-3","duration_ms":120},{"sprite":"walk-4","duration_ms":120},{"sprite":"walk-5","duration_ms":120}]},"talk_blink":{"loop":true,"frames":[{"sprite":"talk-small","duration_ms":240},{"sprite":"talk-blink","duration_ms":100},{"sprite":"talk-small","duration_ms":140},{"sprite":"talk-wide","duration_ms":140},{"sprite":"talk-round","duration_ms":140}]}},"frames":{"neutral":{"equipped":"../frames/neutral.png","base":"../frames/base/neutral.png"},"talk-small":{"equipped":"../frames/talk-small.png","base":"../frames/base/talk-small.png"},"talk-wide":{"equipped":"../frames/talk-wide.png","base":"../frames/base/talk-wide.png"},"talk-round":{"equipped":"../frames/talk-round.png","base":"../frames/base/talk-round.png"},"blink":{"equipped":"../frames/blink.png","base":"../frames/base/blink.png"},"happy":{"equipped":"../frames/happy.png","base":"../frames/base/happy.png"},"surprised":{"equipped":"../frames/surprised.png","base":"../frames/base/surprised.png"},"relaxed":{"equipped":"../frames/relaxed.png","base":"../frames/base/relaxed.png"},"turn-toward":{"equipped":"../frames/turn-toward.png","base":"../frames/base/turn-toward.png"},"turn-away":{"equipped":"../frames/turn-away.png","base":"../frames/base/turn-away.png"},"nod-down":{"equipped":"../frames/nod-down.png","base":"../frames/base/nod-down.png"},"nod-mid":{"equipped":"../frames/nod-mid.png","base":"../frames/base/nod-mid.png"},"walk-0":{"equipped":"../frames/walk-0.png","base":"../frames/base/walk-0.png"},"walk-1":{"equipped":"../frames/walk-1.png","base":"../frames/base/walk-1.png"},"walk-2":{"equipped":"../frames/walk-2.png","base":"../frames/base/walk-2.png"},"walk-3":{"equipped":"../frames/walk-3.png","base":"../frames/base/walk-3.png"},"walk-4":{"equipped":"../frames/walk-4.png","base":"../frames/base/walk-4.png"},"walk-5":{"equipped":"../frames/walk-5.png","base":"../frames/base/walk-5.png"},"give-mid":{"equipped":"../frames/give-mid.png","base":"../frames/base/give-mid.png"},"give-mid-empty":{"equipped":"../frames/give-mid-empty.png","base":"../frames/base/give-mid-empty.png"},"give-extended":{"equipped":"../frames/give-extended.png","base":"../frames/base/give-extended.png"},"give-extended-empty":{"equipped":"../frames/give-extended-empty.png","base":"../frames/base/give-extended-empty.png"},"neutral-no-prop":{"equipped":"../frames/neutral-no-prop.png","base":"../frames/base/neutral-no-prop.png"},"blink-half":{"equipped":"../frames/blink-half.png","base":"../frames/base/blink-half.png"},"talk-blink":{"equipped":"../frames/talk-blink.png","base":"../frames/base/talk-blink.png"}}};const $=id=>document.getElementById(id);let name='walk',index=0,playing=true,elapsed=0,last=0;for(const key of Object.keys(data.clips))$('clip').add(new Option(key,key));$('clip').value=name;function show(){const c=data.clips[name],f=c.frames[index];$('sprite').src=data.frames[f.sprite][$('gear').checked?'equipped':'base'];$('scrub').max=c.frames.length-1;$('scrub').value=index;$('info').textContent=(index+1)+'/'+c.frames.length+' · '+f.sprite+' · '+f.duration_ms+'ms'+(f.event?' · '+f.event:'');$('play').textContent=playing?'일시정지':'재생';}$('clip').onchange=()=>{name=$('clip').value;index=0;elapsed=0;show()};$('gear').onchange=show;$('scale').onchange=()=>{$('stage').style.width=(96*Number($('scale').value))+'px'};$('bg').onchange=()=>{$('stage').style.background=$('bg').value};$('play').onclick=()=>{playing=!playing;show()};function step(delta){playing=false;const n=data.clips[name].frames.length;index=(index+delta+n)%n;elapsed=0;show()};$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('scrub').oninput=()=>{playing=false;index=Number($('scrub').value);elapsed=0;show()};function tick(now){if(last&&playing){elapsed+=(now-last)*Number($('speed').value);const c=data.clips[name];while(elapsed>=c.frames[index].duration_ms){elapsed-=c.frames[index].duration_ms;if(index+1<c.frames.length)index++;else if(c.loop||$('repeat').checked)index=0;else{playing=false;elapsed=0;break}show()}}last=now;requestAnimationFrame(tick)}show();requestAnimationFrame(tick);</script></html>

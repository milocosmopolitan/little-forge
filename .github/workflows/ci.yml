name: Foundation QA
on:
  push:
    branches: [main, feat/bevy-foundation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libudev-dev libasound2-dev libwayland-dev libvulkan1 mesa-vulkan-drivers xvfb
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: python -m pip install -r scripts/requirements-qa.txt
      - run: python scripts/validate-assets.py
      - shell: bash
        run: |
          mkdir -p qa-output
          cargo run --locked --release -p forge-qa > qa-output/simulation.json
      - run: cargo build --locked --release -p little-forge
      - name: Capture Windows DX12 scenes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dxc = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin' -Recurse -Filter dxcompiler.dll | Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$dxc) { throw 'Windows software rendering requires SDK DXC' }
          Copy-Item $dxc.FullName .
          Copy-Item (Join-Path $dxc.Directory.FullName 'dxil.dll') .
          $env:WGPU_BACKEND = 'dx12'
          $env:WGPU_DX12_COMPILER = 'dxc'
          foreach ($scene in @('ambient','sale','expanded')) {
            $png = "qa-output/windows-$scene.png"
            $p = Start-Process target/release/little-forge.exe -ArgumentList @('--safe-window','--qa',$scene,'--screenshot',$png) -PassThru -RedirectStandardOutput "qa-output/windows-$scene.stdout.log" -RedirectStandardError "qa-output/windows-$scene.stderr.log"
            if (!$p.WaitForExit(90000)) { $p.Kill(); throw "Capture timeout: $scene" }
            if (!(Test-Path $png)) { throw "Missing capture: $scene" }
            if (Select-String -Path "qa-output/windows-$scene.stderr.log" -Pattern 'panicked|ERROR') { throw "Renderer error: $scene" }
          }
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: little-forge-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ runner.os }}
          path: qa-output/
          retention-days: 14
  visual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libudev-dev libasound2-dev libvulkan1 mesa-vulkan-drivers xvfb
      - run: cargo build --locked -p little-forge
      - run: python -m pip install -r scripts/requirements-qa.txt
      - run: |
          mkdir -p qa-output
          for scene in ambient sale expanded; do
            timeout 90s xvfb-run -a -s '-screen 0 1280x800x24' target/debug/little-forge --safe-window --qa "$scene" --screenshot "qa-output/$scene.png" > "qa-output/$scene.log" 2>&1
            test -s "qa-output/$scene.png"
            test -s "docs/qa/golden/linux-llvmpipe/$scene.png"
            python scripts/compare-images.py "docs/qa/golden/linux-llvmpipe/$scene.png" "qa-output/$scene.png" --diff "qa-output/$scene-diff.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-candidates
          path: qa-output/
          retention-days: 14

name: Foundation QA
on:
  push:
    branches: [main, feat/bevy-foundation]
  pull_request:
  workflow_dispatch:
    inputs:
      soak:
        description: Run the 30-minute production-clock desktop soak
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libudev-dev libasound2-dev libwayland-dev libvulkan1 mesa-vulkan-drivers xvfb
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: python -m pip install -r scripts/requirements-qa.txt
      - run: python scripts/validate-assets.py
      - run: python scripts/validate-village.py
      - shell: bash
        run: |
          mkdir -p qa-output
          cargo run --locked --release -p forge-qa > qa-output/simulation.json
          cargo run --locked --release -p forge-qa -- life-loop > qa-output/life-multiday.json
      - name: Build Windows diagnostic executable
        if: runner.os == 'Windows'
        run: cargo build --locked -p little-forge
      - name: Compare Windows debug scenes
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/capture-windows.ps1 -Executable target/debug/little-forge.exe -OutputDirectory qa-debug
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-debug-scenes
          path: qa-debug/
          retention-days: 14
      - run: cargo build --locked --release -p little-forge
      - name: Compare Windows release scenes
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/capture-windows.ps1 -Executable target/release/little-forge.exe -OutputDirectory qa-output
      - name: Capture native lifecycle on macOS and Windows
        if: runner.os != 'Linux'
        run: python scripts/capture-lifestyle.py target/release/little-forge${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Capture village UI on native macOS and Windows
        if: runner.os != 'Linux'
        run: python scripts/capture-village.py target/release/little-forge${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: little-forge-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ runner.os }}
          path: qa-output/
          retention-days: 14
  visual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libudev-dev libasound2-dev libvulkan1 mesa-vulkan-drivers xvfb
      - run: cargo build --locked -p little-forge
      - run: python -m pip install -r scripts/requirements-qa.txt
      - run: |
          mkdir -p qa-output
          for scene in ambient sale expanded; do
            timeout 90s xvfb-run -a -s '-screen 0 1280x800x24' target/debug/little-forge --safe-window --qa "$scene" --screenshot "qa-output/$scene.png" > "qa-output/$scene.log" 2>&1
            test -s "qa-output/$scene.png"
            test -s "docs/qa/golden/linux-llvmpipe/$scene.png"
            python scripts/compare-images.py "docs/qa/golden/linux-llvmpipe/$scene.png" "qa-output/$scene.png" --diff "qa-output/$scene-diff.png"
          done
      - name: Capture title screen in actual Bevy app
        run: |
          timeout 90s xvfb-run -a -s '-screen 0 1280x800x24' target/debug/little-forge --safe-window --qa title --screenshot qa-output/title.png > qa-output/title.log 2>&1
          test -s qa-output/title.png
      - name: Capture village navigation and vendors in the actual app
        run: xvfb-run -a -s '-screen 0 1280x800x24' python scripts/capture-village.py target/debug/little-forge
      - name: Verify village with real X11 pointer and keyboard input
        run: xvfb-run -a -s '-screen 0 1280x800x24' python scripts/test-village-input.py target/debug/little-forge
      - name: Capture lifecycle in the actual app
        run: xvfb-run -a -s '-screen 0 1280x800x24' python scripts/capture-lifestyle.py target/debug/little-forge
      - name: Thirty-minute production-clock desktop soak
        if: github.event_name == 'workflow_dispatch' && inputs.soak
        timeout-minutes: 35
        run: xvfb-run -a -s '-screen 0 1280x800x24' python scripts/soak-lifestyle.py target/debug/little-forge --seconds 1800 --output qa-output/life-soak
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-candidates
          path: qa-output/
          retention-days: 14

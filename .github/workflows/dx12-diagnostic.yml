name: DX12 rendering diagnosis
on:
  pull_request:
    paths: ['.github/workflows/dx12-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: little-forge-Windows-X64-ee3b4b6ad1bdefaa183da32733290efd2e32a284
          run-id: 38809455025
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous-build
      - shell: pwsh
        run: |
          Expand-Archive previous-build/little-forge-windows.zip -DestinationPath previous-build/extracted
          $exe = (Get-ChildItem previous-build/extracted -Recurse -Filter little-forge.exe | Select-Object -First 1).FullName
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'dx12-evidence'
          New-Item -ItemType Directory -Force $outDir | Out-Null
          $dxc = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin' -Recurse -Filter dxcompiler.dll -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq 'x64' } | Sort-Object FullName -Descending | Select-Object -First 1
          if ($dxc) {
            Copy-Item $dxc.FullName (Split-Path $exe)
            $dxil = Join-Path $dxc.Directory.FullName 'dxil.dll'
            if (Test-Path $dxil) { Copy-Item $dxil (Split-Path $exe) }
            Get-FileHash $dxc.FullName | Format-List | Out-File "$outDir/compiler.txt"
          }
          Set-Location (Split-Path $exe)
          $env:WGPU_BACKEND = 'dx12'
          $cases = @(@{name='fxc-validation';compiler='fxc';validation='1'}, @{name='fxc-no-validation';compiler='fxc';validation='0'})
          if ($dxc) { $cases += @{name='dxc-validation';compiler='dxc';validation='1'} }
          foreach ($case in $cases) {
            $env:WGPU_DX12_COMPILER = $case.compiler
            $env:WGPU_VALIDATION_INDIRECT_CALL = $case.validation
            foreach ($scene in @('ambient','sale')) {
              $name = "$($case.name)-$scene"
              $p = Start-Process -FilePath $exe -ArgumentList @('--safe-window','--qa',$scene,'--screenshot',"$outDir/$name.png") -PassThru -RedirectStandardOutput "$outDir/$name.stdout.log" -RedirectStandardError "$outDir/$name.stderr.log"
              if (!$p.WaitForExit(90000)) { $p.Kill(); "timeout: $name" | Out-File "$outDir/results.txt" -Append }
              else { "${name}: exit=$($p.ExitCode)" | Out-File "$outDir/results.txt" -Append }
            }
          }
          if (!(Get-ChildItem $outDir -Filter '*.png')) { throw 'DX12 produced no captures; inspect logs' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dx12-diagnosis
          path: dx12-evidence/
          retention-days: 14
